name: Applied Biosystems
description: >-
  Applied Biosystems is a life-sciences instrumentation brand now part of Thermo Fisher Scientific,
  known for genetic analysis and applied genomics platforms including real-time and end-point PCR
  (QuantStudio, StepOne, ViiA 7, ProFlex), Sanger capillary-electrophoresis sequencing (SeqStudio,
  3500/3730 Genetic Analyzers), and mass spectrometry. Its software surface is delivered through
  Thermo Fisher Connect, a cloud platform for storing, analyzing, and sharing instrument data with
  Applied Biosystems qPCR and Sanger secondary-analysis modules, the Cloud Connect Utility for
  uploading data from non-cloud-enabled instruments, and the Instrument Connect remote-monitoring app.
  Applied Biosystems does not publish a standalone public developer API, OpenAPI specification, or SDK
  program; its programmatic footprint is instrument-connectivity and cloud analysis rather than a
  hosted web API. This profile was surfaced as a VC-portfolio lead and enriched with verified company
  identity only.
